name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  gui-smoke:
    name: GUI smoke test (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run tests with a virtual display
        run: xvfb-run -a python3 -m unittest discover -s tests -t . -v
