[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfd-stream-study"
version = "0.1.0"
description = "Desktop explorer for USGS stream gages, NWS forecasts, precipitation sources and rainfall-runoff response."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llascari" }]
keywords = [
    "usgs",
    "streamflow",
    "rainfall-runoff",
    "unit hydrograph",
    "water data",
    "precipitation",
    "weather",
    "nws",
    "open-meteo",
    "cocorahs",
    "tkinter",
]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = []

[project.scripts]
streamstudy = "streamstudy.__main__:main"

[tool.setuptools.packages.find]
include = ["streamstudy*"]
